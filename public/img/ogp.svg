<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent line top-left -->
  <rect x="80" y="80" width="3" height="80" fill="#ffffff" opacity="0.6"/>

  <!-- Large background text -->
  <text x="60" y="520" font-family="'Inter', 'Arial', sans-serif" font-size="200" font-weight="800" fill="rgba(255,255,255,0.04)" letter-spacing="-8">RADIOLOGY</text>

  <!-- Name block -->
  <text x="103" y="195" font-family="'Inter', 'Arial', sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.45)" letter-spacing="4">高木 滉平</text>
  <text x="100" y="270" font-family="'Inter', 'Arial', sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">Kohei Takagi</text>

  <!-- Title tags -->
  <rect x="100" y="295" width="230" height="36" rx="2" fill="rgba(255,255,255,0.1)"/>
  <text x="115" y="318" font-family="'Inter', 'Arial', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.8)" letter-spacing="1">Radiologic Technologist</text>

  <rect x="344" y="295" width="155" height="36" rx="2" fill="rgba(255,255,255,0.1)"/>
  <text x="359" y="318" font-family="'Inter', 'Arial', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.8)" letter-spacing="1">AI Developer</text>

  <!-- Divider -->
  <rect x="100" y="360" width="200" height="1" fill="rgba(255,255,255,0.15)"/>

  <!-- Key achievement -->
  <text x="100" y="400" font-family="'Inter', 'Arial', sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.5)">YOLOv8-pose × X-ray Positioning AI</text>
  <text x="100" y="430" font-family="'Inter', 'Arial', sans-serif" font-size="15" font-weight="400" fill="rgba(255,255,255,0.5)">mAP50 99.8% — Zero Patient Data Required</text>

  <!-- URL -->
  <text x="100" y="540" font-family="'Space Mono', 'Courier New', monospace" font-size="13" fill="rgba(255,255,255,0.3)" letter-spacing="1">tomosoko.github.io/my-homepage</text>

  <!-- Right side: stat cards -->
  <rect x="760" y="160" width="360" height="310" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Stat 1 -->
  <text x="800" y="220" font-family="'Inter', 'Arial', sans-serif" font-size="48" font-weight="800" fill="#ffffff">99.8%</text>
  <text x="800" y="246" font-family="'Inter', 'Arial', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">mAP50 — OsteoVision</text>

  <rect x="800" y="265" width="280" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Stat 2 -->
  <text x="800" y="315" font-family="'Inter', 'Arial', sans-serif" font-size="48" font-weight="800" fill="#ffffff">0</text>
  <text x="800" y="341" font-family="'Inter', 'Arial', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">Patient Data Required</text>

  <rect x="800" y="360" width="280" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Stat 3 -->
  <text x="800" y="410" font-family="'Inter', 'Arial', sans-serif" font-size="48" font-weight="800" fill="#ffffff">3+</text>
  <text x="800" y="436" font-family="'Inter', 'Arial', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">Active Projects</text>
</svg>
