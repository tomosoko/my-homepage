<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Kohei Takagi</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/my-homepage/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fafafa;
            --text: #0a0a0a;
            --muted: #777;
            --border: rgba(0,0,0,0.08);
            --border2: rgba(0,0,0,0.35);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --text: #f0f0f0;
                --muted: #888;
                --border: rgba(255,255,255,0.08);
                --border2: rgba(255,255,255,0.35);
            }
        }

        html { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        .code {
            font-family: 'Space Mono', monospace;
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text);
            opacity: 0.08;
            user-select: none;
            margin-bottom: 2rem;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.03em;
            display: inline-block;
            margin-bottom: 2.5rem;
        }

        .logo-dot { color: var(--muted); }

        h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            border: 1px solid var(--border2);
            color: var(--text);
            border-radius: 2px;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        .divider {
            width: 1px;
            height: 3rem;
            background: var(--border2);
            margin: 0 auto 2.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/my-homepage/" class="logo">KT<span class="logo-dot">.</span></a>
        <div class="code" aria-hidden="true">404</div>
        <div class="divider"></div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/my-homepage/" class="btn">← Back to Homepage</a>
    </div>
</body>
</html>
